seed: 0
model:
  name: Qwen/Qwen3-0.6B
  num_layers: 20
data:
  max_train_questions: 20000
  max_test_questions: 500
  max_state_tokens: 512
  max_choice_tokens: 64
  batch_size: 8
  num_workers: 2
lora:
  last_k_layers: 12
  r: 8
  alpha: 16
  dropout: 0.0
head:
  new_dim: 512
  num_layers: 2
optim:
  epochs: 1
  lr_lora: 0.0001
  lr_head: 0.001
  weight_decay: 0.01
  warmup_ratio: 0.05
  grad_clip: 1.0
  grad_accum_steps: 8
logging:
  log_every: 10
  eval_every: 100
  save_every: 50
